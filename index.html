<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>המשימות שלי</title>
<meta name="theme-color" content="#1e293b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<style>
:root{
  --bg:#f1f5f9; --card:#fff; --ink:#0f172a; --mute:#64748b; --line:#e2e8f0; --soft:#f8fafc;
  --pri:#4f46e5; --pri-soft:#eef2ff; --ok:#059669; --ok-soft:#ecfdf5; --bad:#e11d48; --bad-soft:#fff1f2;
  --warn:#d97706; --warn-soft:#fffbeb; --info:#0284c7; --info-soft:#f0f9ff; --rabbi:#7c3aed; --rabbi-soft:#f5f3ff;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Heebo',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;padding-bottom:90px}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink)}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}

/* כותרת */
header{background:#1e293b;color:#fff;position:sticky;top:0;z-index:30}
.hbar{display:flex;align-items:center;gap:10px;padding:10px 0}
.hbar h1{font-size:19px;margin:0;font-weight:800;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{background:rgba(255,255,255,.12);color:#fff;border-radius:10px;padding:6px 10px;font-size:14px;white-space:nowrap}
.hbtn:hover{background:rgba(255,255,255,.22)}
.dot{width:9px;height:9px;border-radius:50%;background:#94a3b8;display:inline-block;flex:none}
.dot.ok{background:#34d399}.dot.sync{background:#fbbf24}.dot.err{background:#f87171}.dot.local{background:#a78bfa}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{color:#cbd5e1;padding:9px 12px;border-bottom:3px solid transparent;white-space:nowrap;font-weight:500}
nav.tabs button.on{color:#fff;border-color:#818cf8}
@media(max-width:520px){nav.tabs button{padding:9px 6px;font-size:13.5px;flex:1}}
.badge{display:inline-block;min-width:19px;padding:0 5px;border-radius:99px;background:#f43f5e;color:#fff;font-size:12px;font-weight:700;text-align:center;margin-inline-start:4px}

/* פס תאריך אחר */
.datebar{background:#f59e0b;color:#1c1917;font-weight:700;text-align:center;padding:8px 12px;display:none;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.datebar.on{display:flex}
.datebar button{background:#1c1917;color:#fff;border-radius:8px;padding:4px 10px;font-size:13px}
.robar{background:var(--rabbi-soft);color:var(--rabbi);text-align:center;font-size:13px;padding:5px;display:none}
.robar.on{display:block}

main{padding-top:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px;overflow:hidden}
.card-h{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--soft)}
.card-h h2,.card-h h3{margin:0;font-size:16px;font-weight:700;flex:1}
.card-b{padding:12px 14px}
.empty{color:var(--mute);text-align:center;padding:18px 10px;font-size:14px}
.sec-title{font-size:13px;font-weight:700;color:var(--mute);margin:16px 2px 8px}

.btn{border-radius:10px;padding:8px 13px;font-weight:600;font-size:14px;background:var(--pri);color:#fff;white-space:nowrap}
.btn:hover{filter:brightness(1.07)}
.btn.sec{background:#e2e8f0;color:var(--ink)}
.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}.btn.warn{background:var(--warn)}.btn.rabbi{background:var(--rabbi)}
.btn.ghost{background:transparent;color:var(--pri);padding:6px 8px}
.btn.sm{padding:5px 9px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}

/* משימה */
.task{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);background:#fff}
.task:last-child{border-bottom:0}
.task.done .t-title{text-decoration:line-through;color:var(--mute)}
.chk{width:24px;height:24px;border-radius:7px;border:2px solid #cbd5e1;flex:none;margin-top:1px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;background:#fff}
.chk:hover{border-color:var(--ok)}
.chk.on{background:var(--ok);border-color:var(--ok)}
.chk:disabled{cursor:default;opacity:.6}
.t-main{flex:1;min-width:0;cursor:pointer}
.t-title{font-weight:600;word-break:break-word}
.t-meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.chip{font-size:12px;padding:1px 7px;border-radius:99px;background:#f1f5f9;color:#475569;white-space:nowrap;font-weight:500}
.chip.cat{color:#fff}
.chip.late{background:var(--bad-soft);color:var(--bad)}
.chip.today{background:var(--warn-soft);color:var(--warn)}
.chip.cont{background:#fef3c7;color:#92400e}
.chip.rec{background:var(--info-soft);color:var(--info)}
.chip.rab{background:var(--rabbi-soft);color:var(--rabbi)}
.chip.okc{background:var(--ok-soft);color:var(--ok)}
.chip.badc{background:var(--bad-soft);color:var(--bad)}
.chip.fu{background:#f0fdfa;color:#0f766e}
.t-note{font-size:13px;color:var(--mute);margin-top:3px;white-space:pre-wrap;word-break:break-word}
.t-act{display:flex;gap:2px;flex:none}
.ib{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:16px}
.ib:hover{background:#f1f5f9;color:var(--ink)}
.ib.on{color:#f59e0b}
.ib.star{width:28px;height:28px;font-size:19px;margin-top:-2px;flex:none}
.task[data-id]{}
#priList .task{cursor:grab}
.handle{cursor:grab;color:#cbd5e1;font-size:18px;padding:2px 0;flex:none;user-select:none;touch-action:none}
.pnum{font-weight:800;color:var(--pri);min-width:20px;text-align:center;flex:none;margin-top:2px}
.pnote{width:100%;border:0;border-bottom:1px dashed var(--line);font-size:13px;padding:3px 0;margin-top:4px;background:transparent;color:#334155}
.pnote:focus{outline:none;border-color:var(--pri)}
.pgh{display:flex;align-items:center;gap:8px;padding:6px 12px;background:#f8fafc;border-bottom:1px solid var(--line);border-top:1px solid var(--line);font-weight:700;font-size:13.5px;color:#334155}
.pgh:first-child{border-top:0}
.sortable-ghost{opacity:.35;background:var(--pri-soft)}

/* קטגוריות */
.cat-h{cursor:pointer;user-select:none}
.cdot{width:12px;height:12px;border-radius:50%;flex:none}
.sub{border-top:1px solid var(--line)}
.sub-h{display:flex;align-items:center;gap:8px;padding:8px 14px;background:#fcfcfd;font-weight:600;font-size:14px;cursor:pointer}
.sub-b{padding-inline-start:14px}
.caret{transition:transform .15s;color:var(--mute);font-size:12px}
.collapsed .caret{transform:rotate(90deg)}
.collapsed>.cbody{display:none}
.cnt{font-size:12px;color:var(--mute);font-weight:500}

/* החלטה / הרב */
.decide{border:2px solid #fbbf24;background:var(--warn-soft)}
.decide .card-h{background:#fef3c7}
.rcard{padding:12px 14px;border-bottom:1px solid var(--line)}
.rcard:last-child{border-bottom:0}
.thread{margin:8px 0;padding:6px 10px;background:var(--soft);border-radius:10px;font-size:13px}
.thread div{padding:3px 0}
.thread b{color:#334155}
.rinput{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;resize:vertical;min-height:40px}

/* שעות */
.iv{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line)}
.iv:last-child{border-bottom:0}
.iv input[type=time]{border:1px solid var(--line);border-radius:8px;padding:5px 6px;width:104px}
.iv input[type=text]{border:1px solid var(--line);border-radius:8px;padding:5px 8px;flex:1;min-width:120px}
.big{font-size:26px;font-weight:800}
table.sum{width:100%;border-collapse:collapse;font-size:14px}
table.sum td,table.sum th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right}
table.sum th{color:var(--mute);font-weight:600;font-size:13px}
.off{color:var(--info)}

/* היסטוריה */
.day{padding:10px 14px;border-bottom:1px solid var(--line)}
.day-h{display:flex;gap:8px;align-items:center;font-weight:700;margin-bottom:4px;flex-wrap:wrap}
.lg{font-size:14px;padding:2px 0;display:flex;gap:6px;align-items:flex-start}
.lg .x{color:#cbd5e1;font-size:13px;margin-inline-start:auto}
.lg .x:hover{color:var(--bad)}

/* מודל */
.ov{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:50;display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.modal{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:640px){.ov{align-items:center}.modal{border-radius:18px}}
.modal h3{margin:0 0 12px;font-size:18px}
.fld{margin-bottom:11px}
.fld label{display:block;font-size:13px;font-weight:600;color:var(--mute);margin-bottom:4px}
.fld input[type=text],.fld input[type=date],.fld input[type=url],.fld input[type=password],.fld select,.fld textarea{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:9px 10px;background:#fff}
.fld textarea{min-height:70px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid #a5b4fc;border-color:transparent}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mfoot{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid #cbd5e1;border-radius:9px;padding:6px 10px;font-size:14px;background:#fff}
.seg button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.pick{border:1px solid var(--line);border-radius:10px;max-height:46vh;overflow-y:auto}
.pick label{display:flex;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer}
.pick .ph{background:var(--soft);font-weight:700;font-size:13px;padding:6px 10px;color:#334155;position:sticky;top:0}
.link{color:var(--pri);cursor:pointer;text-decoration:underline}

.fab{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:20px;background:var(--pri);color:#fff;border-radius:99px;padding:13px 20px;font-weight:700;box-shadow:0 8px 24px rgba(79,70,229,.35);z-index:40;font-size:16px}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 16px;border-radius:12px;z-index:60;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.toast.err{background:#be123c}
.muted{color:var(--mute);font-size:13px}
.hide{display:none!important}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="hbar">
      <span class="dot" id="syncDot" title=""></span>
      <div style="flex:1;min-width:0"><h1>המשימות שלי</h1><div id="hdrHeb" style="font-size:12px;color:#cbd5e1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></div></div>
      <button class="hbtn" onclick="openDateModal()" title="תיעוד לתאריך אחר">📅 <span id="hdrDate"></span></button>
      <button class="hbtn" id="lockBtn" onclick="toggleLogin()"></button>
      <button class="hbtn" onclick="openSettings()" title="הגדרות">⚙️</button>
    </div>
    <nav class="tabs" id="tabs">
      <button data-tab="pri" onclick="go('pri')">⭐ עדיפויות</button>
      <button data-tab="cats" onclick="go('cats')">📂 קטגוריות</button>
      <button data-tab="rabbi" onclick="go('rabbi')">🕊️ הרב סגל<span id="rabbiBadge"></span></button>
      <button data-tab="hours" onclick="go('hours')">⏱️ שעות</button>
      <button data-tab="hist" onclick="go('hist')">📜 היסטוריה</button>
    </nav>
  </div>
</header>
<div class="datebar" id="dateBar">
  <span>📅 מתעד עבור: <span id="dateBarTxt"></span> · כל הסימונים יירשמו ליום הזה</span>
  <button onclick="setWorkDate(todayISO())">חזרה להיום</button>
</div>
<div class="robar" id="verBar" style="background:#fef2f2;color:#b91c1c">⚠️ צריך לעדכן את קוד השרת (Code.gs) — חלק מההגדרות לא יישמרו עד העדכון. <a href="https://github.com/shnotik770-netizen/my-tasks/blob/main/README.md#עדכון-קוד-השרת-בעתיד" target="_blank" style="color:inherit">איך?</a></div>
<div class="robar" id="roBar">מצב צפייה · אפשר לאשר, לסמן ולכתוב הערות בלשונית "הרב סגל"</div>

<main class="wrap" id="view"></main>

<button class="fab hide" id="fab" onclick="openTask(null)">＋ משימה</button>
<div class="ov" id="ov" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* =========================================================
   הגדרות
   ========================================================= */
// כתובת ה-Apps Script (אחרי פריסה). אפשר גם להגדיר מתוך ⚙️ באתר.
const DEFAULT_GAS_URL = 'https://script.google.com/macros/s/AKfycbyLvAJdKErmUG-T3eIX0vLqjoYrK46KSCp2FyIlDzScN2WHWNkHjetLHg_tyI7Wt3Il/exec';

const LS = {
  gas: 'mt_gas', code: 'mt_code', data: 'mt_data', queue: 'mt_queue', author: 'mt_author',
  tab: 'mt_tab', collapsed: 'mt_collapsed', showDone: 'mt_showdone'
};
const NEEDED_SERVER_VERSION = 2;
const SHEET_KEYS = { Categories:'id', Tasks:'id', Log:'id', RabbiNotes:'id', WorkHours:'id', DaysOff:'date', Priorities:'taskId' };
const REC_LABEL = { none:'ללא', daily:'יומית', weekly:'שבועית', monthly:'חודשית', bimonthly:'דו־חודשית', yearly:'שנתית' };
const PALETTE = ['#2563eb','#16a34a','#d97706','#dc2626','#7c3aed','#0891b2','#db2777','#4b5563','#65a30d','#9333ea'];

function lsGet(k, d){ try{ const v = localStorage.getItem(k); return v === null ? d : v; }catch(e){ return d; } }
function lsSet(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }
function lsJSON(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }

let gasUrl = lsGet(LS.gas, DEFAULT_GAS_URL) || '';
let editCode = lsGet(LS.code, '');
let isEditor = !!(lsGet(LS.gas, DEFAULT_GAS_URL) ? lsGet(LS.code, '') : true);
let S = emptyData();
let queue = lsJSON(LS.queue, []);
// מסך פתיחה: עורך ← עדיפויות, צופה ← הרב סגל
let tab = isEditor ? 'pri' : 'rabbi';
let workDate = todayISO();
let collapsed = lsJSON(LS.collapsed, {});
let showDone = lsGet(LS.showDone, '0') === '1';
let syncState = 'idle';

function emptyData(){ return { Categories:[], Tasks:[], Log:[], Priorities:[], RabbiNotes:[], WorkHours:[], DaysOff:[] }; }
const isLocal = () => !gasUrl;

/* =========================================================
   עזרים
   ========================================================= */
function pad(n){ return String(n).padStart(2,'0'); }
function isoOf(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function todayISO(){ return isoOf(new Date()); }
function parseISO(s){ const [y,m,d] = String(s).split('-').map(Number); return new Date(y, (m||1)-1, d||1); }
function nowHM(){ const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function heDate(iso, long){
  if (!iso) return '';
  const d = parseISO(iso);
  const g = d.toLocaleDateString('he-IL', long ? { weekday:'long', day:'numeric', month:'long', year:'numeric' } : { weekday:'short', day:'numeric', month:'numeric' });
  return long ? g + ' · ' + hebDate(iso, true) : g;
}
/* ---------- תאריך עברי ---------- */
function gematria(n){
  if (n === 15) return 'ט״ו'; if (n === 16) return 'ט״ז';
  const H = [[400,'ת'],[300,'ש'],[200,'ר'],[100,'ק'],[90,'צ'],[80,'פ'],[70,'ע'],[60,'ס'],[50,'נ'],[40,'מ'],[30,'ל'],[20,'כ'],[10,'י'],[9,'ט'],[8,'ח'],[7,'ז'],[6,'ו'],[5,'ה'],[4,'ד'],[3,'ג'],[2,'ב'],[1,'א']];
  let out = '';
  while (n > 0){
    if (n % 100 === 15 && n < 100){ out += 'טו'; break; } if (n % 100 === 16 && n < 100){ out += 'טז'; break; }
    if (n === 15){ out += 'טו'; break; } if (n === 16){ out += 'טז'; break; }
    for (const [v, ch] of H){ if (n >= v){ out += ch; n -= v; break; } }
  }
  return out.length === 1 ? out + '׳' : out.slice(0, -1) + '״' + out.slice(-1);
}
const hebFmt = (() => { try { return new Intl.DateTimeFormat('he-IL-u-ca-hebrew', { day:'numeric', month:'long', year:'numeric' }); } catch(e){ return null; } })();
function hebParts(iso){
  if (!hebFmt || !iso) return null;
  const d = parseISO(iso); d.setHours(12);
  const p = {}; hebFmt.formatToParts(d).forEach(x => p[x.type] = x.value);
  if (!p.day || !p.month) return null;
  return { day: gematria(+p.day), month: p.month, year: gematria((+p.year) % 1000) };
}
// withYear: "י״ד כסלו תשפ״ז" · בלי: "י״ד כסלו"
function hebDate(iso, withYear){ const h = hebParts(iso); return h ? h.day + ' ' + h.month + (withYear ? ' ' + h.year : '') : ''; }
function hebMonthsOf(ym){
  const [y, m] = ym.split('-').map(Number); const last = new Date(y, m, 0).getDate();
  const a = hebParts(ym + '-01'), b = hebParts(ym + '-' + pad(last)); if (!a || !b) return '';
  return a.month === b.month ? a.month + ' ' + b.year : a.month + (a.year !== b.year ? ' ' + a.year : '') + '–' + b.month + ' ' + b.year;
}
function shortDate(iso){ if(!iso) return ''; const d = parseISO(iso); return d.getDate() + '.' + (d.getMonth()+1); }
function daysBetween(a, b){ return Math.round((parseISO(b) - parseISO(a)) / 86400000); }
function addDays(iso, n){ const d = parseISO(iso); d.setDate(d.getDate()+n); return isoOf(d); }
function addMonths(iso, n){
  const d = parseISO(iso); const day = d.getDate();
  const t = new Date(d.getFullYear(), d.getMonth()+n, 1);
  const last = new Date(t.getFullYear(), t.getMonth()+1, 0).getDate();
  t.setDate(Math.min(day, last)); return isoOf(t);
}
function nextDue(iso, rec){
  if (rec === 'daily') return addDays(iso, 1);
  if (rec === 'weekly') return addDays(iso, 7);
  if (rec === 'monthly') return addMonths(iso, 1);
  if (rec === 'bimonthly') return addMonths(iso, 2);
  if (rec === 'yearly') return addMonths(iso, 12);
  return '';
}
function uid(p){ return p + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function truthy(v){ return v === true || v === 'TRUE' || v === 'true'; }
function hmToMin(t){ if(!t || !/^\d{1,2}:\d{2}/.test(t)) return null; const [h,m] = t.split(':').map(Number); return h*60+m; }
function fmtHours(min){ const h = Math.floor(min/60), m = Math.round(min%60); return h + ':' + pad(m); }

let toastT;
function toast(msg, err){
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast on' + (err ? ' err' : '');
  clearTimeout(toastT); toastT = setTimeout(() => t.className = 'toast', err ? 4500 : 2400);
}

/* =========================================================
   נתונים: גישה
   ========================================================= */
const cat = id => S.Categories.find(c => String(c.id) === String(id));
const task = id => S.Tasks.find(t => String(t.id) === String(id));
const liveTasks = () => S.Tasks.filter(t => t.status !== 'deleted');
const openTasks = () => S.Tasks.filter(t => t.status === 'open');
function catsSorted(){ return S.Categories.filter(c => c.active !== false).slice().sort((a,b) => (+a.order||0) - (+b.order||0) || String(a.name).localeCompare(b.name,'he')); }
const roots = () => catsSorted().filter(c => !c.parentId);
const childrenOf = id => catsSorted().filter(c => String(c.parentId) === String(id));
function catPath(id){ const c = cat(id); if(!c) return 'ללא קטגוריה'; const p = c.parentId ? cat(c.parentId) : null; return p ? p.name + ' › ' + c.name : c.name; }
function catColor(id){ const c = cat(id); if(!c) return '#94a3b8'; if(c.color) return c.color; const p = c.parentId && cat(c.parentId); return (p && p.color) || '#64748b'; }
function priList(){ return S.Priorities.slice().sort((a,b) => (+a.order||0) - (+b.order||0)).filter(p => { const t = task(p.taskId); return t && t.status === 'open'; }); }
const isFuture = t => t.status === 'open' && t.recurrence && t.recurrence !== 'none' && t.dueDate && t.dueDate > todayISO();
function rootOf(catId){ const c = cat(catId); return c ? (c.parentId ? String(c.parentId) : String(c.id)) : ''; }
function rootOrder(rid){ const c = cat(rid); return c ? (+c.order || 0) : 9999; }
// הוספה לעדיפויות: נכנסת אחרי המשימה האחרונה מאותה קטגוריה, ואם אין — לפי סדר הקטגוריות
function priInsert(list, ids){
  list = list.slice();
  ids.forEach(id => {
    if (list.some(p => String(p.taskId) === String(id))) return;
    const t = task(id); const r = t ? rootOf(t.categoryId) : '';
    let at = -1;
    list.forEach((p, i) => { const pt = task(p.taskId); if (pt && rootOf(pt.categoryId) === r) at = i; });
    if (at < 0){ at = list.findIndex(p => { const pt = task(p.taskId); return pt && rootOrder(rootOf(pt.categoryId)) > rootOrder(r); }); if (at < 0) at = list.length; else at -= 1; }
    list.splice(at + 1, 0, { taskId:id, note:'' });
  });
  return list;
}
function sortPriByCat(){
  const list = priList().map((p,i) => ({ p, i }));
  list.sort((a,b) => { const ta = task(a.p.taskId), tb = task(b.p.taskId);
    return rootOrder(rootOf(ta.categoryId)) - rootOrder(rootOf(tb.categoryId)) || rootOf(ta.categoryId).localeCompare(rootOf(tb.categoryId)) || a.i - b.i; });
  commit([ priOps(list.map(x => x.p)) ], 'מוין לפי קטגוריות');
}
function priBlocks(list){
  const blocks = [];
  list.forEach((p, i) => { const t = task(p.taskId); const r = rootOf(t.categoryId); const last = blocks[blocks.length-1];
    if (last && last.root === r) last.end = i; else blocks.push({ root:r, start:i, end:i }); });
  return blocks;
}
function moveBlock(bi, dir){
  const list = priList(); const bl = priBlocks(list); const a = bl[bi], b = bl[bi+dir]; if (!a || !b) return;
  const first = dir < 0 ? b : a, second = dir < 0 ? a : b;
  const out = list.slice(0, first.start).concat(list.slice(second.start, second.end+1), list.slice(first.start, first.end+1), list.slice(second.end+1));
  commit([ priOps(out) ]);
}
const inPri = id => S.Priorities.some(p => String(p.taskId) === String(id));
const notesOf = id => S.RabbiNotes.filter(n => String(n.taskId) === String(id)).sort((a,b) => String(a.id).localeCompare(String(b.id)));
const rabbiPending = () => liveTasks().filter(t => t.rabbiType && t.rabbiStatus === 'pending');
const needDecision = () => openTasks().filter(t => truthy(t.needsDecision));
const followups = id => liveTasks().filter(t => String(t.parentTaskId) === String(id));
const dayOff = d => S.DaysOff.find(x => x.date === d);

/* =========================================================
   שמירה: פעולות → מקומי + שרת
   ========================================================= */
function applyOps(ops){
  ops.forEach(op => {
    if (op.op === 'setPriorities'){ S.Priorities = op.list.map((p,i) => ({ taskId:p.taskId, order:i+1, note:p.note||'' })); return; }
    const key = SHEET_KEYS[op.sheet]; const arr = S[op.sheet];
    if (op.op === 'upsert'){
      const i = arr.findIndex(r => String(r[key]) === String(op.rec[key]));
      if (i >= 0) arr[i] = Object.assign({}, arr[i], op.rec); else arr.push(Object.assign({}, op.rec));
    } else if (op.op === 'delete'){
      S[op.sheet] = arr.filter(r => String(r[key]) !== String(op.id));
    }
  });
}
function saveCache(){ lsSet(LS.data, JSON.stringify(S)); }

function commit(ops, msg){
  if (!isEditor){ toast('צריך קוד עריכה כדי לשנות', true); return false; }
  if (!ops.length) return true;
  applyOps(ops); saveCache(); render();
  if (msg) toast(msg);
  if (!isLocal()) enqueue({ action:'batch', ops });
  return true;
}
const up = (sheet, rec) => ({ op:'upsert', sheet, rec });
const del = (sheet, id) => ({ op:'delete', sheet, id });
function priOps(list){ return { op:'setPriorities', list: list.map(p => ({ taskId:p.taskId, note:p.note||'' })) }; }

function enqueue(payload){ queue.push(payload); lsSet(LS.queue, JSON.stringify(queue)); flush(); }

async function api(payload){
  const body = Object.assign({}, payload);
  if (editCode) body.code = editCode;
  const r = await fetch(gasUrl, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

let flushing = false, retryT = null;
async function flush(){
  if (flushing || isLocal()) return;
  flushing = true; setSync('sync');
  try{
    while (queue.length){
      let res;
      try { res = await api(queue[0]); }
      catch(e){ setSync('err', 'אין חיבור — השינויים נשמרו ויישלחו שוב'); clearTimeout(retryT); retryT = setTimeout(flush, 15000); return; }
      queue.shift(); lsSet(LS.queue, JSON.stringify(queue));
      if (!res || res.status !== 'success'){ toast('שגיאת שרת: ' + ((res && res.message) || 'לא ידועה'), true); }
    }
    setSync('ok');
  } finally { flushing = false; }
}

async function load(silent){
  if (isLocal()){
    const d = lsJSON(LS.data, null);
    S = Object.assign(emptyData(), d || seedLocal());
    isEditor = true; setSync('local'); render(); return;
  }
  const cached = lsJSON(LS.data, null);
  if (cached && !silent){ S = Object.assign(emptyData(), cached); render(); }
  if (queue.length) await flush();
  if (queue.length) return;
  setSync('sync');
  try{
    const res = await api({ action:'load' });
    if (!res || res.status !== 'success') throw new Error((res && res.message) || 'שגיאה');
    if (queue.length) return; // שינוי חדש נכנס בזמן הטעינה — נטען שוב בפעם הבאה
    S = Object.assign(emptyData(), res.data);
    document.getElementById('verBar').classList.toggle('on', isEditorCode() && (res.version || 1) < NEEDED_SERVER_VERSION);
    isEditor = !!res.editor;
    if (editCode && !res.editor){ editCode = ''; lsDel(LS.code); toast('קוד העריכה כבר לא תקף — עברת למצב צפייה', true); if (tab !== 'rabbi') tab = 'rabbi'; }
    saveCache(); setSync('ok'); render();
  } catch(e){
    setSync('err', String(e.message || e));
    if (!silent) toast('הטעינה מהשרת נכשלה: ' + (e.message || e), true);
  }
}

function isEditorCode(){ return !!editCode; }
function seedLocal(){
  return Object.assign(emptyData(), { Categories:[
    { id:'c1', name:'שוטף בנקים', parentId:'', color:'#2563eb', order:1, active:true },
    { id:'c2', name:'שכר', parentId:'', color:'#16a34a', order:2, active:true },
    { id:'c3', name:'בית ספר', parentId:'', color:'#d97706', order:3, active:true }
  ]});
}

function setSync(s, title){
  syncState = s;
  const d = document.getElementById('syncDot');
  d.className = 'dot ' + ({ ok:'ok', sync:'sync', err:'err', local:'local' }[s] || '');
  d.title = title || ({ ok:'מחובר לגוגל שיטס', sync:'מסנכרן…', err:'בעיית חיבור', local:'מצב מקומי — הנתונים נשמרים רק בדפדפן הזה' }[s] || '');
}

/* =========================================================
   פעולות על משימות
   ========================================================= */
function logOp(taskId, result, note){ return up('Log', { id:uid('l'), taskId, date:workDate, result, note:note||'', createdAt:new Date().toISOString() }); }

function markDone(id){
  const t = task(id); if (!t || !isEditor) return;
  if (t.status === 'done'){ return reopen(id); }
  if (truthy(t.continuous)){
    openModal(`<h3>🔁 משימה מתמשכת</h3>
      <p><b>${esc(t.title)}</b></p>
      <p class="muted">האם היא הסתיימה סופית, או שעבדת עליה היום והיא ממשיכה?</p>
      <div class="fld"><label>הערה (לא חובה)</label><input type="text" id="cNote"></div>
      <div class="mfoot">
        <button class="btn ok" onclick="finishDone('${t.id}', val('cNote'))">✓ הסתיימה סופית</button>
        <button class="btn warn" onclick="logProgress('${t.id}', val('cNote'))">◐ עבדתי עליה — ממשיכה</button>
        <button class="btn sec" onclick="closeModal()">ביטול</button>
      </div>`);
    return;
  }
  finishDone(id, '');
}
function finishDone(id, note){
  const t = task(id); if (!t) return;
  closeModal();
  const now = new Date().toISOString();
  const ops = [ logOp(id, 'done', note), up('Tasks', { id, status:'done', doneDate:workDate, needsDecision:false, updatedAt:now }) ];
  let msg = '✓ סומן כבוצע' + (workDate !== todayISO() ? ' ב-' + shortDate(workDate) : '');
  const rec = t.recurrence || 'none';
  if (rec !== 'none'){
    const fixed = truthy(t.fixedSchedule) && t.dueDate;
    // רגיל: המועד הבא נספר מיום הביצוע. תאריך קבוע: לפי תאריך היעד (ומדלגים על מועדים שעברו)
    let nd = nextDue(fixed ? t.dueDate : workDate, rec);
    if (fixed) while (nd && nd <= workDate) nd = nextDue(nd, rec);
    ops.push(up('Tasks', { id:uid('t'), title:t.title, categoryId:t.categoryId, dueDate:nd, recurrence:rec, fixedSchedule:truthy(t.fixedSchedule), status:'open', continuous:truthy(t.continuous),
      parentTaskId:'', rabbiType:'', rabbiStatus:'', needsDecision:false, notes:t.notes||'', createdAt:now, updatedAt:now, doneDate:'' }));
    msg += ' · הבאה: ' + heDate(nd);
  }
  if (inPri(id)) ops.push(priOps(priList().filter(p => String(p.taskId) !== String(id))));
  commit(ops, msg);
}
function logProgress(id, note){ closeModal(); commit([ logOp(id, 'progress', note) ], '◐ תועדה עבודה'); }
function reopen(id){
  if (!confirm('להחזיר את המשימה לפתוחה?')) return;
  const t = task(id);
  const ops = [ up('Tasks', { id, status:'open', doneDate:'', updatedAt:new Date().toISOString() }) ];
  const l = S.Log.filter(x => String(x.taskId) === String(id) && x.result === 'done').sort((a,b) => String(b.createdAt).localeCompare(String(a.createdAt)))[0];
  if (l) ops.push(del('Log', l.id));
  commit(ops, 'הוחזרה לפתוחה');
}
function openLogModal(id){
  const t = task(id); if (!t) return;
  openModal(`<h3>תיעוד: ${esc(t.title)}</h3>
    <p class="muted">יירשם לתאריך: <b>${heDate(workDate, true)}</b></p>
    <div class="fld"><label>הערה</label><textarea id="lNote" placeholder="מה נעשה / למה לא בוצע…"></textarea></div>
    <div class="mfoot">
      <button class="btn ok" onclick="finishDone('${t.id}', val('lNote'))">✓ בוצע</button>
      <button class="btn warn" onclick="logProgress('${t.id}', val('lNote'))">◐ התקדמות</button>
      <button class="btn bad" onclick="closeModal();commit([logOp('${t.id}','not_done',val('lNote'))],'✗ תועד: לא בוצע')">✗ לא בוצע</button>
      <button class="btn sec" onclick="closeModal()">ביטול</button>
    </div>`);
}
function togglePri(id){
  if (!isEditor) return;
  const list = priList();
  if (inPri(id)) commit([ priOps(list.filter(p => String(p.taskId) !== String(id))) ], 'הוסר מהעדיפויות');
  else commit([ priOps(priInsert(list, [id])) ], '⭐ נוסף לעדיפויות');
}
function setPriNote(id, note){
  const list = priList().map(p => String(p.taskId) === String(id) ? Object.assign({}, p, { note }) : p);
  commit([ priOps(list) ]);
}
function movePri(from, to){
  const list = priList(); if (to < 0 || to >= list.length) return;
  const [x] = list.splice(from, 1); list.splice(to, 0, x); commit([ priOps(list) ]);
}

/* החלטה על משימת המשך */
function decideDelete(id){ if (!confirm('למחוק את משימת ההמשך?')) return; commit([ up('Tasks', { id, status:'deleted', needsDecision:false, updatedAt:new Date().toISOString() }) ], 'נמחקה'); }
function decideKeep(id){ commit([ up('Tasks', { id, needsDecision:false, updatedAt:new Date().toISOString() }) ], 'נשארת פתוחה בקטגוריה'); }
function decideSchedule(id){
  openModal(`<h3>תזמון משימת המשך</h3>
    <div class="fld"><label>לאיזה תאריך?</label><input type="date" id="dsDate" value="${addDays(todayISO(),7)}"></div>
    <div class="mfoot"><button class="btn" onclick="(function(){const d=val('dsDate'); if(!d) return; closeModal(); commit([up('Tasks',{id:'${id}',dueDate:d,needsDecision:false,updatedAt:new Date().toISOString()})],'📅 תוזמנה ל-'+heDate(d));})()">שמור</button>
    <button class="btn sec" onclick="closeModal()">ביטול</button></div>`);
}

/* =========================================================
   הרב סגל
   ========================================================= */
function author(){ return lsGet(LS.author, ''); }
function askAuthor(){
  const n = prompt('השם שלך (יופיע ליד ההערות והסימונים):', author() || '');
  if (n === null) return null;
  const v = n.trim(); if (!v) return null;
  lsSet(LS.author, v); return v;
}
function rabbiAct(id, act){
  const t = task(id); if (!t) return;
  const a = author() || askAuthor(); if (!a) return;
  const box = document.getElementById('rin_' + id);
  const text = box ? box.value.trim() : '';
  if (act === 'comment' && !text){ toast('כתוב הערה קודם', true); return; }
  const noteId = uid('n'), followupId = uid('t'), now = new Date().toISOString();
  const ops = [ up('RabbiNotes', { id:noteId, taskId:id, author:a, date:todayISO(), action:act, text }) ];
  if (act !== 'comment') ops.push(up('Tasks', { id, rabbiStatus: act === 'approve' ? 'approved' : act === 'reject' ? 'rejected' : 'seen', updatedAt:now }));
  if (act === 'reject') ops.push(up('Tasks', { id:followupId, title:'המשך: ' + t.title, categoryId:t.categoryId, dueDate:'', recurrence:'none', status:'open', continuous:false,
    parentTaskId:id, rabbiType:'', rabbiStatus:'', needsDecision:true, notes: text ? 'הרב סגל לא אישר: ' + text : 'הרב סגל לא אישר', createdAt:now, updatedAt:now, doneDate:'' }));
  applyOps(ops); saveCache(); render();
  toast({ approve:'✅ אושר', reject:'❌ לא אושר — נוצרה משימת המשך', seen:'👁 סומן "ראיתי"', comment:'💬 ההערה נשמרה' }[act]);
  if (!isLocal()) enqueue({ action:'rabbiAction', taskId:id, act, text, author:a, date:todayISO(), noteId, followupId });
}
function copyRabbiWhatsApp(){
  const pend = rabbiPending();
  if (!pend.length){ toast('אין משימות ממתינות'); return; }
  let s = '*משימות הממתינות לרב סגל* (' + heDate(todayISO()) + ')\n';
  const ap = pend.filter(t => t.rabbiType === 'approve'), inf = pend.filter(t => t.rabbiType === 'info');
  if (ap.length){ s += '\n*לאישור:*\n'; ap.forEach((t,i) => s += (i+1) + '. ' + t.title + ' [' + catPath(t.categoryId) + ']' + (t.notes ? ' — ' + t.notes : '') + '\n'); }
  if (inf.length){ s += '\n*לידיעה:*\n'; inf.forEach((t,i) => s += (i+1) + '. ' + t.title + ' [' + catPath(t.categoryId) + ']' + (t.notes ? ' — ' + t.notes : '') + '\n'); }
  copyText(s);
}
function copyText(s){
  (navigator.clipboard ? navigator.clipboard.writeText(s) : Promise.reject()).then(() => toast('📋 הועתק — אפשר להדביק בוואטסאפ'))
    .catch(() => { const ta = document.createElement('textarea'); ta.value = s; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); toast('📋 הועתק'); }catch(e){ prompt('העתק:', s); } ta.remove(); });
}

function taskRow(t, ctx, idx){
  const done = t.status === 'done';
  const meta = [];
  if (ctx === 'pri'){ const c = cat(t.categoryId); if (c && c.parentId) meta.push(`<span class="chip cat" style="background:${catColor(t.categoryId)}">${esc(c.name)}</span>`); }
  else if (ctx !== 'cat') meta.push(`<span class="chip cat" style="background:${catColor(t.categoryId)}">${esc(catPath(t.categoryId))}</span>`);
  if (t.dueDate && !done){
    const dd = daysBetween(todayISO(), t.dueDate);
    meta.push(`<span class="chip ${dd < 0 ? 'late' : dd === 0 ? 'today' : ''}">📅 ${dd < 0 ? 'באיחור · ' : dd === 0 ? 'היום · ' : ''}${heDate(t.dueDate)} · ${hebDate(t.dueDate)}</span>`);
  }
  if (done && t.doneDate) meta.push(`<span class="chip okc">✓ ${heDate(t.doneDate)}</span>`);
  if (t.recurrence && t.recurrence !== 'none') meta.push(`<span class="chip rec">↻ ${REC_LABEL[t.recurrence] || t.recurrence}${truthy(t.fixedSchedule) ? ' · 📌' : ''}</span>`);
  if (isFuture(t)) meta.push(`<span class="chip">⏳ יופיע ב-${heDate(t.dueDate)}</span>`);
  if (truthy(t.continuous)) meta.push(`<span class="chip cont">🔁 מתמשכת</span>`);
  if (t.rabbiType){
    const st = t.rabbiStatus;
    if (st === 'pending') meta.push(`<span class="chip rab">🕊️ ${t.rabbiType === 'approve' ? 'ממתין לאישור הרב' : 'לידיעת הרב'}</span>`);
    else if (st === 'approved') meta.push(`<span class="chip okc">✅ הרב אישר</span>`);
    else if (st === 'rejected') meta.push(`<span class="chip badc">❌ הרב לא אישר</span>`);
    else if (st === 'seen') meta.push(`<span class="chip okc">👁 הרב ראה</span>`);
  }
  if (t.parentTaskId){ const p = task(t.parentTaskId); meta.push(`<span class="chip fu">↳ המשך של: ${esc(p ? p.title : '—')}</span>`); }
  const fus = followups(t.id).filter(f => f.status === 'open').length;
  if (fus) meta.push(`<span class="chip fu">⤷ ${fus} המשך פתוח</span>`);
  const prog = S.Log.filter(l => String(l.taskId) === String(t.id) && l.result === 'progress').length;
  if (prog && !done) meta.push(`<span class="chip">◐ ${prog} תיעודים</span>`);
  const lastRabbi = notesOf(t.id).filter(n => n.text && (n.action === 'comment' || n.action === 'approve')).pop();
  const pri = inPri(t.id);
  return `<div class="task ${done ? 'done' : ''}" data-id="${esc(t.id)}">
    ${ctx === 'pri' && isEditor ? `<span class="handle" title="גרור לשינוי סדר">⠿</span>` : ''}
    ${ctx === 'pri' ? `<span class="pnum">${idx+1}</span>` : ''}
    <button class="chk ${done ? 'on' : ''}" ${isEditor ? '' : 'disabled'} onclick="markDone('${esc(t.id)}')" title="${done ? 'בוצע — לחץ להחזרה' : 'סמן כבוצע'}">${done ? '✓' : ''}</button>
    ${isEditor && !done ? `<button class="ib star ${pri ? 'on' : ''}" title="${pri ? 'הסר מהעדיפויות' : 'הוסף לעדיפויות'}" onclick="togglePri('${esc(t.id)}')">${pri ? '★' : '☆'}</button>` : ''}
    <div class="t-main" onclick="openTask('${esc(t.id)}')">
      <div class="t-title">${esc(t.title)}</div>
      ${meta.length ? `<div class="t-meta">${meta.join('')}</div>` : ''}
      ${t.notes ? `<div class="t-note">${esc(t.notes)}</div>` : ''}

    </div>` : ''}

}

    ${isEditor && list.length > 1 ? `<button class="btn sm sec" title="סדר מחדש לפי סדר הקטגוריות" onclick="if(confirm('לסדר את כל הרשימה לפי סדר הקטגוריות? (הסדר הפנימי בכל קטגוריה נשמר)'))sortPriByCat()">⇅ לפי קטגוריה</button>` : ''}

  if (!list.length) h += `<div class="empty">הרשימה ריקה.${isEditor ? '<br>הוסף משימות מהקטגוריות לפי סדר העבודה.' : ''}</div>`;
  else {

    h += `<div id="priList">` + bl.map((b, bi) => {
      const c = cat(b.root);

        ${isEditor && showGroupArrows ? `<button class="ib" title="הזז את כל הקטגוריה למעלה" ${bi === 0 ? 'disabled style="opacity:.25"' : ''} onclick="moveBlock(${bi},-1)">⏶</button><button class="ib" title="הזז את כל הקטגוריה למטה" ${bi === bl.length-1 ? 'disabled style="opacity:.25"' : ''} onclick="moveBlock(${bi},1)">⏷</button>` : ''}</div>`
        + list.slice(b.start, b.end + 1).map((p, k) => taskRow(task(p.taskId), 'pri', b.start + k)).join('');
    }).join('') + `</div>`;
  }
  h += `</div>`;
  // הערות לפריטים ברשימה (שורה נפרדת מתחת לכל אחד) — עריכה מהירה
  if (list.length && isEditor){
    h += `<details class="card"><summary class="card-h" style="cursor:pointer"><h3>✏️ הערות לפריטים ברשימה</h3></summary><div class="card-b">` +

      `</div></details>`;

  const due = openTasks().filter(t => t.dueDate && t.dueDate <= addDays(todayISO(), 0) && !inPri(t.id) && !truthy(t.needsDecision))

  if (doneLogs.length){
    h += `<div class="card"><div class="card-h"><h3>📝 תועד ${workDate === todayISO() ? 'היום' : 'ב-' + heDate(workDate)} (${doneLogs.length})</h3></div><div class="card-b">${doneLogs.map(logLine).join('')}</div></div>`;

function logLine(l){
  const t = task(l.taskId);
  const icon = { done:'<span style="color:var(--ok)">✓</span>', progress:'<span style="color:var(--warn)">◐</span>', not_done:'<span style="color:var(--bad)">✗</span>' }[l.result] || '•';
  return `<div class="lg">${icon}<span><span class="${t ? 'link' : ''}" ${t ? `onclick="openTask('${t.id}')"` : ''}>${esc(t ? t.title : '(משימה שנמחקה)')}</span>${l.note ? ` <span class="muted">— ${esc(l.note)}</span>` : ''}</span>

function delLog(id){
  if (!confirm('למחוק את התיעוד הזה?')) return;

  if (l && l.result === 'done'){ const t = task(l.taskId); if (t && t.status === 'done' && confirm('להחזיר גם את המשימה לפתוחה?')) ops.push(up('Tasks', { id:t.id, status:'open', doneDate:'' })); }

}

let showGroupArrows = false;

function openPicker(){
  const avail = openTasks().filter(t => !inPri(t.id) && !isFuture(t));
  let h = `<h3>הוספה לרשימת העדיפויות</h3>
    <div class="fld"><input type="text" id="pkSearch" placeholder="🔍 חיפוש…" oninput="filterPicker(this.value)" style="width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:9px 10px"></div>
    <div class="pick" id="pickBox">`;
  const groups = [];
  roots().forEach(r => { groups.push(r); childrenOf(r.id).forEach(c => groups.push(c)); });

    const ts = avail.filter(t => String(t.categoryId) === String(g.id));

    h += `<div class="ph" data-g>${esc(catPath(g.id))}</div>` + ts.map(t => `<label data-t="${esc(t.title.toLowerCase())}"><input type="checkbox" value="${t.id}"> <span class="grow">${esc(t.title)}</span>${t.dueDate ? `<span class="chip">${shortDate(t.dueDate)}</span>` : ''}</label>`).join('');
  });

  if (orphan.length){ any = true; h += `<div class="ph">ללא קטגוריה</div>` + orphan.map(t => `<label data-t="${esc(t.title.toLowerCase())}"><input type="checkbox" value="${t.id}"> ${esc(t.title)}</label>`).join(''); }
  if (!any) h += `<div class="empty">אין משימות פתוחות שאינן ברשימה.</div>`;
  h += `</div><div class="mfoot">
    <button class="btn" onclick="addPicked()">הוסף נבחרות</button>
    <button class="btn sec" onclick="closeModal();openTask(null,{toPri:true})">＋ משימה חדשה</button>
    <button class="btn sec" onclick="closeModal()">ביטול</button></div>`;
  openModal(h);
}
function filterPicker(q){

}
function addPicked(){
  const ids = [...document.querySelectorAll('#pickBox input:checked')].map(i => i.value);
  if (!ids.length){ toast('לא נבחרו משימות', true); return; }
  closeModal();

}

/* ---------- קטגוריות ---------- */
function viewCats(){
  let h = `<div class="row" style="margin-bottom:12px">
    <label class="row muted" style="gap:5px;cursor:pointer"><input type="checkbox" ${showDone ? 'checked' : ''} onchange="showDone=this.checked;lsSet(LS.showDone,showDone?'1':'0');render()"> הצג גם משימות שבוצעו ומשימות חוזרות שמועדן טרם הגיע</label>
    <span class="grow"></span>
    ${isEditor ? `<button class="btn sm sec" onclick="openCat(null)">＋ קטגוריה</button>` : ''}</div>`;
  const rs = roots();
  if (!rs.length) h += `<div class="card"><div class="empty">אין עדיין קטגוריות.${isEditor ? ' התחל ב"＋ קטגוריה".' : ''}</div></div>`;

  const sortT = (a,b) => (a.status === b.status ? 0 : a.status === 'open' ? -1 : 1) || String(a.dueDate||'9999').localeCompare(String(b.dueDate||'9999')) || String(a.createdAt).localeCompare(String(b.createdAt));
  rs.forEach(r => {

    const inRoot = t => (String(t.categoryId) === String(r.id) || subs.some(s => String(s.id) === String(t.categoryId)));
    const fut = S.Tasks.filter(t => isFuture(t) && inRoot(t)).length;
    const total = S.Tasks.filter(t => t.status === 'open' && !isFuture(t) && (String(t.categoryId) === String(r.id) || subs.some(s => String(s.id) === String(t.categoryId)))).length;
    const col = collapsed[r.id];
    h += `<div class="card ${col ? 'collapsed' : ''}">
      <div class="card-h cat-h" onclick="toggleCol('${r.id}')">

        <h2>${esc(r.name)}${catRabbi(r.id) ? ' <span class="chip rab">🕊️ ' + RABBI_CAT_LABEL[catRabbi(r.id)] + '</span>' : ''} <span class="cnt">(${total})${fut && !showDone ? ' · ' + fut + ' מתוזמנות' : ''}</span></h2>
        ${isEditor ? `<button class="ib" title="משימה חדשה בקטגוריה" onclick="event.stopPropagation();openTask(null,{categoryId:'${r.id}'})">＋</button>
        <button class="ib" title="עריכת קטגוריה" onclick="event.stopPropagation();openCat('${r.id}')">✎</button>` : ''}
      </div><div class="cbody">
      ${own.map(t => taskRow(t,'cat')).join('')}
      ${subs.map(s => {
        const st = S.Tasks.filter(t => String(t.categoryId) === String(s.id) && visible(t)).sort(sortT);
        const sc = collapsed[s.id];
        return `<div class="sub ${sc ? 'collapsed' : ''}"><div class="sub-h" onclick="toggleCol('${s.id}')"><span class="caret">▼</span><span class="cdot" style="background:${catColor(s.id)}"></span>
          <span class="grow">${esc(s.name)}${catRabbi(s.id) ? ' <span class="chip rab">🕊️ ' + RABBI_CAT_LABEL[catRabbi(s.id)] + '</span>' : ''} <span class="cnt">(${st.filter(t => t.status === 'open' && !isFuture(t)).length})</span></span>
          ${isEditor ? `<button class="ib" title="משימה חדשה" onclick="event.stopPropagation();openTask(null,{categoryId:'${s.id}'})">＋</button>
          <button class="ib" title="עריכה" onclick="event.stopPropagation();openCat('${s.id}')">✎</button>` : ''}</div>
          <div class="cbody sub-b">${st.length ? st.map(t => taskRow(t,'cat')).join('') : '<div class="empty">אין משימות</div>'}</div></div>`;
      }).join('')}
      ${!own.length && !subs.length ? '<div class="empty">אין משימות</div>' : ''}
      </div></div>`;
  });
  const orphan = S.Tasks.filter(t => visible(t) && !cat(t.categoryId));
  if (orphan.length) h += `<div class="card"><div class="card-h"><h2>ללא קטגוריה</h2></div>${orphan.map(t => taskRow(t,'cat')).join('')}</div>`;
  return h;
}
function toggleCol(id){ collapsed[id] = !collapsed[id]; lsSet(LS.collapsed, JSON.stringify(collapsed)); render(); }

    <div class="two"><div class="fld"><label>צבע</label><input type="color" id="cColor" value="${color}" style="width:100%;height:40px;border:1px solid #cbd5e1;border-radius:10px"></div>

      <button class="btn" onclick="saveCat('${c ? c.id : ''}')">שמור</button>

  const fillR = () => {

    const opts = p

      : [['', 'רגילה — לא נשלח אוטומטית'], ['approve','כל משימה חדשה נשלחת לאישור הרב'], ['info','כל משימה חדשה נשלחת לידיעת הרב']];

function saveCat(id){
  const name = val('cName').trim(); if (!name){ toast('חסר שם', true); return; }
  const rec = { id: id || uid('c'), name, parentId: document.getElementById('cParent').value, color: val('cColor'), order: Number(val('cOrder')) || 0, active: true, rabbiDefault: val('cRabbi') };
  closeModal(); commit([ up('Categories', rec) ], 'הקטגוריה נשמרה');
}
function deleteCat(id){
  const used = liveTasks().some(t => String(t.categoryId) === String(id));
  if (used){ toast('יש משימות בקטגוריה — העבר או מחק אותן קודם', true); return; }
  if (childrenOf(id).length){ toast('יש לה תת־קטגוריות — מחק אותן קודם', true); return; }
  if (!confirm('למחוק את הקטגוריה?')) return;
  closeModal(); commit([ del('Categories', id) ], 'נמחקה');
}

// ברירת מחדל של הרב סגל לקטגוריה (תת־קטגוריה יורשת מהאב)
// ערכים: '' = ירושה (בתת־קטגוריה) / ללא (בראשית) · 'none' = ללא, גם אם האב שולח · 'approve' · 'info'
function catRabbi(id){
  const c = cat(id); if (!c) return '';
  if (c.rabbiDefault === 'none') return '';
  if (c.rabbiDefault) return c.rabbiDefault;
  const p = c.parentId && cat(c.parentId);
  return p && p.rabbiDefault && p.rabbiDefault !== 'none' ? p.rabbiDefault : '';
}
const RABBI_CAT_LABEL = { approve:'לאישור', info:'לידיעה' };
function applyCatRabbi(){
  const d = catRabbi(val('mCat')); if (!d) return;
  mRabbi = d;
  const btn = document.querySelector('#mRabSeg button[data-r="' + d + '"]'); if (btn) segOn('mRabSeg', btn);
}
function catOptions(sel){
  let h = '';
  roots().forEach(r => {
    h += `<option value="${r.id}" ${String(sel) === String(r.id) ? 'selected' : ''}>${esc(r.name)}</option>`;
    childrenOf(r.id).forEach(c => h += `<option value="${c.id}" ${String(sel) === String(c.id) ? 'selected' : ''}>　└ ${esc(c.name)}</option>`);
  });
  return h;
}

/* ---------- חלון משימה ---------- */
let mRec = 'none', mRabbi = '';

  preset = preset || {};
  const t = id ? task(id) : null;

  if (!t && !roots().length){ toast('צור קודם קטגוריה', true); go('cats'); return; }
  const parent = t ? (t.parentTaskId && task(t.parentTaskId)) : (preset.parentTaskId && task(preset.parentTaskId));
  const fus = t ? followups(t.id) : [];
  const notes = t ? notesOf(t.id) : [];
  const logs = t ? S.Log.filter(l => String(l.taskId) === String(t.id)).sort((a,b) => String(b.date).localeCompare(String(a.date))) : [];
  mRec = (t && t.recurrence) || 'none'; mRabbi = t ? (t.rabbiType || '') : catRabbi(preset.categoryId || (roots()[0] && roots()[0].id));
  const ro = !isEditor;
  const dis = ro ? 'disabled' : '';
  let h = `<h3>${t ? (ro ? 'משימה' : 'עריכת משימה') : 'משימה חדשה'}</h3>`;
  if (parent) h += `<div class="chip fu" style="margin-bottom:10px;display:inline-block">↳ המשך של: <span class="link" onclick="openTask('${parent.id}')">${esc(parent.title)}</span></div>`;
  h += `<div class="fld"><label>מה צריך לעשות</label><input type="text" id="mTitle" ${dis} value="${esc(t ? t.title : (preset.title || (parent ? 'המשך: ' + parent.title : '')))}"></div>
    <div class="two">
      <div class="fld"><label>קטגוריה</label><select id="mCat" ${dis} onchange="applyCatRabbi()">${catOptions(t ? t.categoryId : (preset.categoryId || ''))}</select></div>

      <button type="button" data-r="info" ${dis} class="${mRabbi === 'info' ? 'on' : ''}" onclick="mRabbi='info';segOn('mRabSeg',this)">👁 לידיעת הרב</button>

function noteLine(n){
  const lab = { approve:'✅ אישר', reject:'❌ לא אישר', seen:'👁 ראה', comment:'💬', sent:'📤 נשלח לרב' }[n.action] || n.action;
  return `<div><b>${esc(n.author || '')}</b> <span class="muted">${shortDate(n.date)}</span> ${lab}${n.text ? ': ' + esc(n.text) : ''}</div>`;
}
function segOn(id, b){ document.querySelectorAll('#' + id + ' button').forEach(x => x.classList.remove('on')); b.classList.add('on'); }
function val(id){ const e = document.getElementById(id); return e ? e.value : ''; }

function saveTask(id, toPri, parentId){
  const title = val('mTitle').trim(); if (!title){ toast('חסרה כותרת', true); return; }
  const now = new Date().toISOString();
  const old = id ? task(id) : null;
  const rec = { id: id || uid('t'), title, categoryId: val('mCat'), dueDate: val('mDue'), recurrence: mRec,
    continuous: document.getElementById('mCont').checked, fixedSchedule: document.getElementById('mFixed').checked, notes: val('mNotes'), rabbiType: mRabbi, updatedAt: now };
  const resend = document.getElementById('mResend') && document.getElementById('mResend').checked;
  const ops = [];
  const newlySent = mRabbi && (!old || old.rabbiType !== mRabbi || resend || !old.rabbiStatus);
  if (!mRabbi) rec.rabbiStatus = '';
  else if (newlySent) rec.rabbiStatus = 'pending';
  if (!old){ Object.assign(rec, { status:'open', parentTaskId: parentId || '', needsDecision:false, createdAt:now, doneDate:'' }); }
  ops.push(up('Tasks', rec));
  if (newlySent) ops.push(up('RabbiNotes', { id:uid('n'), taskId:rec.id, author:author() || 'אני', date:todayISO(), action:'sent', text: mRabbi === 'approve' ? 'לאישור' : 'לידיעה' }));
  if (toPri && !old){ S.Tasks.push(rec); const pl = priInsert(priList(), [rec.id]); S.Tasks.pop(); ops.push(priOps(pl)); }
  closeModal();
  commit(ops, old ? 'נשמר' : (toPri ? '⭐ נוצרה ונוספה לעדיפויות' : 'המשימה נוצרה'));
}
function deleteTask(id){
  if (!confirm('למחוק את המשימה?')) return;
  closeModal();
  const ops = [ up('Tasks', { id, status:'deleted', needsDecision:false, updatedAt:new Date().toISOString() }) ];
  if (inPri(id)) ops.push(priOps(priList().filter(p => String(p.taskId) !== String(id))));
  commit(ops, 'נמחקה');
}

      <div class="t-meta"><span class="chip cat" style="background:${catColor(t.categoryId)}">${esc(catPath(t.categoryId))}</span>${t.dueDate ? `<span class="chip">📅 ${heDate(t.dueDate)}</span>` : ''}</div>
      ${t.notes ? `<div class="t-note">${esc(t.notes)}</div>` : ''}

      <div class="row" style="margin-top:8px">
        ${kind === 'approve'
          ? `<button class="btn sm ok" onclick="rabbiAct('${t.id}','approve')">✅ מאשר</button>
             <button class="btn sm bad" onclick="rabbiAct('${t.id}','reject')">❌ לא מאשר</button>`
          : `<button class="btn sm ok" onclick="rabbiAct('${t.id}','seen')">👁 ראיתי</button>`}
        <button class="btn sm sec" onclick="rabbiAct('${t.id}','comment')">💬 שמור הערה</button>
      </div></div>`;
  };

  h += `<div class="card"><div class="card-h" style="background:var(--rabbi-soft)"><h2>🕊️ ממתין לאישור (${ap.length})</h2></div>${ap.length ? ap.map(t => card(t,'approve')).join('') : '<div class="empty">אין משימות שממתינות לאישור</div>'}</div>`;
  h += `<div class="card"><div class="card-h" style="background:var(--info-soft)"><h2>👁 לידיעה (${inf.length})</h2></div>${inf.length ? inf.map(t => card(t,'info')).join('') : '<div class="empty">אין משימות לידיעה</div>'}</div>`;
  const since = addDays(todayISO(), -14);
  const recent = S.RabbiNotes.filter(n => ['approve','reject','seen'].includes(n.action) && n.date >= since).sort((a,b) => String(b.id).localeCompare(String(a.id))).slice(0, 25);
  if (recent.length) h += `<div class="card"><div class="card-h"><h3>טופל לאחרונה</h3></div><div class="card-b">${recent.map(n => { const t = task(n.taskId); return `<div class="lg"><span class="muted">${shortDate(n.date)}</span> ${t ? `<span class="link" onclick="openTask('${t.id}')">${esc(t.title)}</span>` : '—'} · ${noteLine(n).replace(/^<div>|<\/div>$/g,'')}</div>`; }).join('')}</div></div>`;

/* ---------- שעות עבודה ---------- */
let hoursMonth = todayISO().slice(0,7);
function ivMinutes(iv){ const s = hmToMin(iv.start), e = hmToMin(iv.end); return s !== null && e !== null && e > s ? e - s : 0; }
function dayMinutes(d){ return S.WorkHours.filter(w => w.date === d).reduce((a,w) => a + ivMinutes(w), 0); }
function viewHours(){
  const d = workDate, isToday = d === todayISO();
  const ivs = S.WorkHours.filter(w => w.date === d).sort((a,b) => String(a.start).localeCompare(String(b.start)));
  const open = ivs.find(w => w.start && !w.end);
  const off = dayOff(d);
  const ed = isEditor ? '' : 'disabled';
  let h = `<div class="card"><div class="card-h"><h2>⏱️ ${isToday ? 'היום' : heDate(d, true)}</h2><span class="big">${fmtHours(dayMinutes(d))}</span></div><div class="card-b">`;
  if (off) h += `<div class="row" style="background:var(--info-soft);padding:8px 10px;border-radius:10px;margin-bottom:10px"><span class="grow off">🏖️ יום חופש${off.reason ? ' — ' + esc(off.reason) : ''}</span>${isEditor ? `<button class="btn sm sec" onclick="commit([del('DaysOff','${d}')],'בוטל סימון יום חופש')">בטל</button>` : ''}</div>`;
  if (isEditor){
    h += `<div class="row" style="margin-bottom:8px">`;
    if (isToday) h += open ? `<button class="btn bad" onclick="stopNow('${open.id}')">⏹ סיימתי עכשיו (${nowHM()})</button>` : `<button class="btn ok" onclick="startNow()">▶ התחלתי עכשיו</button>`;
    h += `<button class="btn sec" onclick="addIv()">＋ סבב ידני</button>`;
    if (!off) h += `<button class="btn sec" onclick="markOff()">🏖️ יום חופש</button>`;
    h += `</div>`;
  }
  h += ivs.length ? ivs.map(w => `<div class="iv">
      <input type="time" value="${esc(w.start)}" ${ed} onchange="setIv('${w.id}','start',this.value)">
      <span class="muted">עד</span>
      <input type="time" value="${esc(w.end)}" ${ed} onchange="setIv('${w.id}','end',this.value)">
      <span class="chip">${w.end ? fmtHours(ivMinutes(w)) : 'פתוח'}</span>
      <input type="text" value="${esc(w.note)}" ${ed} placeholder="הערה (למשל: פגישה בחוץ)" onchange="setIv('${w.id}','note',this.value)">
      ${isEditor ? `<button class="ib" title="מחק" onclick="if(confirm('למחוק את הסבב?'))commit([del('WorkHours','${w.id}')])">🗑️</button>` : ''}
    </div>`).join('') : `<div class="empty">לא נרשמו שעות ליום הזה</div>`;
  h += `</div></div>`;

  // סיכום חודשי
  const [yy, mm] = hoursMonth.split('-').map(Number);
  const last = new Date(yy, mm, 0).getDate();
  let rows = '', tot = 0, workDays = 0, offDays = 0;
  for (let i = 1; i <= last; i++){
    const di = hoursMonth + '-' + pad(i);
    const m = dayMinutes(di), o = dayOff(di);
    if (!m && !o) continue;
    tot += m; if (m) workDays++; if (o) offDays++;
    rows += `<tr><td><span class="link" onclick="setWorkDate('${di}')">${heDate(di)}</span> <span class="muted">${hebDate(di)}</span></td><td>${m ? fmtHours(m) : ''}</td><td class="off">${o ? '🏖️ ' + esc(o.reason || 'חופש') : ''}</td></tr>`;
  }
  const monthName = new Date(yy, mm-1, 1).toLocaleDateString('he-IL', { month:'long', year:'numeric' });
  h += `<div class="card"><div class="card-h"><button class="ib" onclick="shiftMonth('hours',-1)">→</button><h2 style="text-align:center">${monthName}<div class="muted" style="font-weight:500">${hebMonthsOf(hoursMonth)}</div></h2><button class="ib" onclick="shiftMonth('hours',1)">←</button></div>
    <div class="card-b"><div class="row" style="gap:18px;margin-bottom:8px"><div><div class="muted">סה"כ שעות</div><div class="big">${fmtHours(tot)}</div></div>
    <div><div class="muted">ימי עבודה</div><div class="big">${workDays}</div></div><div><div class="muted">ימי חופש</div><div class="big off">${offDays}</div></div></div>
    ${rows ? `<table class="sum"><tr><th>יום</th><th>שעות</th><th></th></tr>${rows}</table>` : '<div class="empty">אין נתונים בחודש הזה</div>'}</div></div>`;
  return h;
}
function startNow(){ commit([ up('WorkHours', { id:uid('w'), date:workDate, start:nowHM(), end:'', note:'' }) ], '▶ התחלת סבב ' + nowHM()); }
function stopNow(id){ commit([ up('WorkHours', { id, end:nowHM() }) ], '⏹ הסבב נסגר ' + nowHM()); }
function addIv(){ const last = S.WorkHours.filter(w => w.date === workDate).map(w => w.end).filter(Boolean).sort().pop(); commit([ up('WorkHours', { id:uid('w'), date:workDate, start:last || '', end:'', note:'' }) ]); }
function setIv(id, f, v){ commit([ up('WorkHours', { id, [f]:v }) ]); }
function markOff(){
  const r = prompt('סיבת יום החופש (חג, מחלה, חופשה…):'); if (r === null) return;
  commit([ up('DaysOff', { date:workDate, reason:r.trim() }) ], '🏖️ סומן יום חופש');
}
function shiftMonth(which, n){
  const ref = which === 'hours' ? hoursMonth : histMonth;
  const [y, m] = ref.split('-').map(Number); const d = new Date(y, m-1+n, 1);
  const v = d.getFullYear() + '-' + pad(d.getMonth()+1);
  if (which === 'hours') hoursMonth = v; else histMonth = v;
  render();
}

/* ---------- היסטוריה ---------- */
let histMonth = todayISO().slice(0,7);
function viewHist(){
  const [yy, mm] = histMonth.split('-').map(Number);
  const monthName = new Date(yy, mm-1, 1).toLocaleDateString('he-IL', { month:'long', year:'numeric' });
  const days = new Set();
  S.Log.forEach(l => l.date && l.date.startsWith(histMonth) && days.add(l.date));
  S.WorkHours.forEach(w => w.date && w.date.startsWith(histMonth) && days.add(w.date));
  S.DaysOff.forEach(o => o.date && o.date.startsWith(histMonth) && days.add(o.date));
  S.RabbiNotes.forEach(n => n.date && n.date.startsWith(histMonth) && n.action !== 'sent' && days.add(n.date));
  const sorted = [...days].sort().reverse();
  let h = `<div class="card"><div class="card-h"><button class="ib" onclick="shiftMonth('hist',-1)">→</button><h2 style="text-align:center">${monthName}<div class="muted" style="font-weight:500">${hebMonthsOf(histMonth)}</div></h2><button class="ib" onclick="shiftMonth('hist',1)">←</button></div>`;
  if (!sorted.length) h += `<div class="empty">אין פעילות בחודש הזה</div>`;
  sorted.forEach(d => {
    const logs = S.Log.filter(l => l.date === d);
    const m = dayMinutes(d), o = dayOff(d);
    const rn = S.RabbiNotes.filter(n => n.date === d && n.action !== 'sent');
    h += `<div class="day"><div class="day-h"><span>${heDate(d, true)}</span>
      ${m ? `<span class="chip">⏱️ ${fmtHours(m)}</span>` : ''}${o ? `<span class="chip rec">🏖️ ${esc(o.reason || 'חופש')}</span>` : ''}
      <span class="grow"></span>${isEditor ? `<button class="btn ghost sm" onclick="setWorkDate('${d}');go('pri')">תעד ליום הזה</button>` : ''}</div>
      ${logs.map(logLine).join('')}
      ${rn.map(n => { const t = task(n.taskId); return `<div class="lg">🕊️ <span>${t ? esc(t.title) : '—'} · ${noteLine(n).replace(/^<div>|<\/div>$/g,'')}</span></div>`; }).join('')}
    </div>`;
  });
  h += `</div>`;
  return h;
}

async function toggleLogin(){
  if (isEditor){
    if (!confirm('לצאת ממצב עריכה (למצב צפייה)?')) return;
    editCode = ''; lsDel(LS.code); isEditor = false; go('rabbi'); toast('עברת למצב צפייה'); return;
  }
  const c = prompt('קוד עריכה:'); if (!c) return;
  try{
    setSync('sync');
    const r = await fetch(gasUrl, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify({ action:'checkCode', code:c }) }).then(x => x.json());
    setSync('ok');
    if (r.status !== 'success') throw new Error(r.message);
    if (!r.ok){ toast('קוד שגוי', true); return; }
    editCode = c; lsSet(LS.code, c); isEditor = true; go('pri'); toast('🔓 נכנסת למצב עריכה — הקוד נשמר במכשיר הזה');
  } catch(e){ setSync('err'); toast('בדיקת הקוד נכשלה: ' + (e.message || e), true); }
}

    ${!isLocal() ? `<button class="btn sm sec" onclick="load()">🔄 רענן נתונים</button>` : ''}</div>
    <div class="fld" style="margin-top:14px"><label>השם שלי (להערות בתיבת הרב)</label><div class="row"><span class="grow">${esc(author() || '—')}</span><button class="btn sm sec" onclick="askAuthor();openSettings()">שנה</button></div></div>
    ${q ? `<p class="muted">⏳ ${q} שינויים ממתינים לשליחה. <span class="link" onclick="flush()">נסה עכשיו</span></p>` : ''}
    <div class="mfoot">
      <button class="btn sm sec" onclick="exportJSON()">⬇️ גיבוי (JSON)</button>
      ${!isLocal() && isEditor && lsJSON('mt_local_backup', null) ? `<button class="btn sm warn" onclick="uploadLocal()">⬆️ העלה נתונים מהמצב המקומי</button>` : ''}
      <button class="btn sm sec" onclick="closeModal()">סגור</button>
    </div>`);
}
function saveGas(){
  const v = val('sGas').trim();
  if (v && !/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(v)){ toast('הכתובת צריכה להיראות כמו https://script.google.com/macros/s/…/exec', true); return; }
  if (isLocal() && v){ lsSet('mt_local_backup', JSON.stringify(S)); }
  gasUrl = v; if (v) lsSet(LS.gas, v); else lsDel(LS.gas);
  lsDel(LS.data); queue = []; lsSet(LS.queue, '[]');
  if (v){ editCode = ''; lsDel(LS.code); isEditor = false; }
  closeModal(); S = emptyData(); load();
  toast(v ? 'מתחבר לגוגל שיטס… היכנס עם קוד העריכה' : 'עברת למצב מקומי');
}
function uploadLocal(){
  const d = lsJSON('mt_local_backup', null); if (!d) return;
  if (!confirm('להעלות את כל הנתונים מהמצב המקומי לגוגל שיטס? (רשומות עם אותו מזהה יוחלפו)')) return;
  const ops = [];
  ['Categories','Tasks','Log','RabbiNotes','WorkHours','DaysOff'].forEach(sh => (d[sh] || []).forEach(r => ops.push(up(sh, r))));
  if (d.Priorities && d.Priorities.length) ops.push(priOps(d.Priorities.slice().sort((a,b) => a.order - b.order)));
  closeModal(); commit(ops, '⬆️ מעלה ' + ops.length + ' רשומות…');
  lsDel('mt_local_backup');
}
function exportJSON(){
  const blob = new Blob([JSON.stringify(S, null, 2)], { type:'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'my-tasks-' + todayISO() + '.json'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

/* =========================================================
   מודל
   ========================================================= */
function openModal(html){ document.getElementById('modal').innerHTML = html; document.getElementById('ov').classList.add('on'); }
function closeModal(){ document.getElementById('ov').classList.remove('on'); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* =========================================================
   הפעלה
   ========================================================= */
load();
setInterval(() => { if (!isLocal() && document.visibilityState === 'visible' && !queue.length && !document.getElementById('ov').classList.contains('on')) load(true); }, 120000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && !isLocal() && !queue.length) load(true); });
// חצות: אם עבר יום ותאריך העבודה היה "היום" — מתעדכן
setInterval(() => { const t = todayISO(); if (render.lastToday && render.lastToday !== t && workDate === render.lastToday){ workDate = t; render(); } render.lastToday = t; }, 60000);
render.lastToday = todayISO();
</script>
